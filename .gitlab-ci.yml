stages:
  - unit-tests
  - pre-build-scans
  - build
  - post-build-scans
  - post-build-tests

test:
  stage: unit-tests
  image: python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6

  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest

gitleaks:
  stage: pre-build-scans
  image:
    name: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]

  script:
    - gitleaks detect --log-opts="-1" --source . --no-banner --report-format sarif --report-path gitleaks.sarif

  artifacts:
    paths:
      - gitleaks.sarif
    expire_in: 12 hrs
    when: always

semgrep:
  stage: pre-build-scans
  image:
    name: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    entrypoint: [""]

  script:
    - cp -a "$CI_PROJECT_DIR"/. /src/
    - semgrep scan --config=auto --error --sarif --sarif-output=/"$CI_PROJECT_DIR"/semgrep.sarif

  artifacts:
    paths:
      - semgrep.sarif
    expire_in: 12 hrs
    when: always

trivy-sca:
  stage: pre-build-scans
  image:
    name: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: [""]
  
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-sca.sarif .

  artifacts:
    paths:
      - trivy-sca.sarif
    expire_in: 12 hrs
    when: always

docker-build:
  stage: build
  image: 
    name: moby/buildkit:rootless@sha256:2d564747600af8d6bd4ebe9b1b645acfd11709f16647d3fde3f421f13f339087
    entrypoint: [""]

  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

  script:
    - buildctl-daemonless.sh build
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --output type=docker,name=lab:ci,dest=lab.tar

  artifacts:
    paths:
      - lab.tar
    expire_in: 12 hrs

trivy-image-scan:
  stage: post-build-scans
  image:
    name: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: [""]

  script:
    - trivy image --ignorefile ./.trivyignore.yml --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-image.sarif --input lab.tar

  artifacts:
    paths:
      - trivy-image.sarif
    expire_in: 12 hrs
    when: always

health-and-zap-test:
  stage: post-build-scans
  image: docker:cli@sha256:4d742ab934c2149b628bf26369ac3ec51cb91e2e28fe6722a0e86a6d6efc4bd5
  services:
    - name: docker:dind-rootless@sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    
  script:
    - bash ci-scripts/health-and-zap-test.sh

  artifacts:
    paths:
      - zap.html
      - zap.json
    expire_in: 12 hrs
    when: always