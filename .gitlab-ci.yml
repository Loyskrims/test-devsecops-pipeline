stages:
  - unit-tests
  - pre-build-scans
  - build
  - post-build-scans
  - post-build-tests

test:
  stage: unit-tests
  image: python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6

  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest

gitleaks:
  stage: pre-build-scans
  image:
    name: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]

  script:
    - gitleaks detect --source . --no-banner

semgrep:
  stage: pre-build-scans
  image:
    name: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    entrypoint: [""]

  needs:
    - gitleaks

  script:
    - cp -a "$CI_PROJECT_DIR"/. /src/
    - semgrep scan --config=auto --error

trivy-sca:
  stage: pre-build-scans
  image:
    name: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]

  needs:
    - gitleaks
  
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

docker-build:
  stage: build
  image: 
    name: moby/buildkit:rootless@sha256:2d564747600af8d6bd4ebe9b1b645acfd11709f16647d3fde3f421f13f339087
    entrypoint: [""]

  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

  script:
    - buildctl-daemonless.sh build
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --output type=oci,dest=lab

  artifacts:
    paths:
      - lab.tar
    expire_in: 12 hrs

trivy-image-scan:
  stage: post-build-scans
  image:
    name: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]

  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --input lab